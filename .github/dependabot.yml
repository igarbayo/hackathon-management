# RNF-SEC-011 (specs/09-privacidad-seguridad.md): dependency scanning in CI for
# api, web and cli. Dependabot does not need a workflow: GitHub runs it from
# this file alone.
version: 2
updates:
  - package-ecosystem: bundler
    directory: /apps/api
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
