# Lint, tests and static analysis on every push (10-roadmap.md#dod-común: "there
# are tests" in every phase). Secret scanning is separate, in security.yml.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reuse:
    # Every file declares its copyright and license (ADR-0016, REUSE.toml).
    name: reuse · licenses and copyright
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: fsfe/reuse-action@v6

  api:
    name: api · rubocop, brakeman, bundler-audit, rspec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # apps/api/.env is in .gitignore (secrets only in environment variables,
      # RNF-SEC-010). The checks in this job do not call any external service,
      # so the example values are enough for docker compose to find the file it
      # expects.
      - name: Prepare the example .env
        run: cp apps/api/.env.example apps/api/.env

      - name: Build the api image
        run: docker compose build api

      - name: Rubocop
        run: docker compose run --rm api bundle exec rubocop

      - name: Brakeman
        run: docker compose run --rm api bundle exec brakeman -q

      - name: bundler-audit
        run: docker compose run --rm api bundle exec bundler-audit check --update

      - name: Start mongo and redis
        run: docker compose up -d mongo redis

      - name: RSpec
        run: >
          docker compose run --rm
          -e RAILS_ENV=test
          -e MONGODB_URI=mongodb://mongo:27017/hackboard_test
          -e REDIS_URL=redis://redis:6379/1
          api bundle exec rspec

      - name: Stop services
        if: always()
        run: docker compose down -v

  web:
    name: web · eslint, vitest, next build (with typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: ESLint
        run: npm run lint --workspace apps/web

      - name: Vitest
        run: npm run test --workspace apps/web

      # next build already runs "tsc" as part of the build (it first generates
      # the .next/types types that layout.tsx needs); a separate tsc --noEmit
      # here fails on a clean checkout because those types do not exist yet.
      - name: Next build (includes TypeScript)
        run: npm run build --workspace apps/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

  packages:
    name: packages · cli, shared-schemas, npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm

      - run: npm ci

      - name: shared-schemas · vitest
        run: npm run test --workspace packages/shared-schemas

      - name: shared-schemas · build
        run: npm run build --workspace packages/shared-schemas

      - name: cli · vitest
        run: npm run test --workspace packages/cli

      - name: cli · build
        run: npm run build --workspace packages/cli

      - name: npm audit (RNF-SEC-011)
        run: npm audit --audit-level=high
