# Publishes the `hackboard` CLI to npm with provenance (RNF-SEC-012).
#
# It runs when a `cli-vX.Y.Z` tag is pushed that matches the version in
# packages/cli/package.json. Provenance signs the package with the OIDC identity
# of this workflow, so anyone can check on npmjs.com that the tarball came from
# this repo and this commit, not from a laptop.
#
# Requirements (once): an NPM_TOKEN secret with an "Automation" or "Granular"
# token from an npm account with 2FA turned on.
name: Release CLI

on:
  push:
    tags:
      - "cli-v*"

concurrency:
  group: release-cli
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # needed for npm publish --provenance

jobs:
  publish:
    name: npm publish · hackboard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check that the tag matches the version
        run: |
          expected="cli-v$(node -p "require('./packages/cli/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "The tag $GITHUB_REF_NAME does not match the package version ($expected)." >&2
            exit 1
          fi

      - run: npm ci

      - name: npm audit (RNF-SEC-011)
        run: npm audit --audit-level=high

      # prepublishOnly cleans dist, builds and runs the tests before uploading
      # anything.
      - name: Publish
        run: npm publish --workspace packages/cli --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
