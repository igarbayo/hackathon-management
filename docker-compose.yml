services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build: ./apps/api
    ports:
      - "3001:3001"
    environment:
      MONGODB_URI: mongodb://mongo:27017/hackboard_development
      REDIS_URL: redis://redis:6379/0
      APP_URL: http://localhost:3000
      API_URL: http://localhost:3001
    env_file:
      - ./apps/api/.env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./apps/api:/app
      - api_bundle:/usr/local/bundle

  worker:
    build: ./apps/api
    command: bundle exec sidekiq -C config/sidekiq.yml
    environment:
      MONGODB_URI: mongodb://mongo:27017/hackboard_development
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ./apps/api/.env
    depends_on:
      - mongo
      - redis
    volumes:
      - ./apps/api:/app
      - api_bundle:/usr/local/bundle

  web:
    build: ./apps/web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules

volumes:
  mongo_data:
  redis_data:
  api_bundle:
  web_node_modules:
