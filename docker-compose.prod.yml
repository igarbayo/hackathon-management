# The logs contain IPs (09-privacidad-seguridad, technical logs): they are
# rotated so they do not pile up forever, as /privacy promises.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    image: hackboard-api:local
    ports:
      - "3001:3001"
    env_file:
      - ./apps/api/.env.production
    depends_on:
      - redis
    restart: unless-stopped
    mem_limit: 400m
    logging: *logging
    environment:
      RAILS_MAX_THREADS: "3"

  worker:
    image: hackboard-api:local
    command: bundle exec sidekiq -C config/sidekiq.yml -c 3
    env_file:
      - ./apps/api/.env.production
    depends_on:
      - api
      - redis
    restart: unless-stopped
    mem_limit: 350m
    logging: *logging
    # The image's HEALTHCHECK curls the API, which the worker does not serve:
    # this one checks the Sidekiq heartbeat in Redis instead.
    healthcheck:
      test: ["CMD", "bin/sidekiq-healthcheck"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 3

  # Sidekiq queues, rate limiting and short-lived caches (01-arquitectura).
  # Valkey (BSD-3-Clause) instead of redis:7 keeps the stack OSI-approved
  # (docs/COMPONENTS_LICENSE.md). No published port: only api and worker reach
  # it, over the compose network, so REDIS_URL is redis://redis:6379/0.
  # noeviction is required by Sidekiq (a full Redis must reject writes, not
  # drop jobs) and the AOF keeps queued and retrying jobs across restarts.
  redis:
    image: valkey/valkey:8-alpine
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    restart: unless-stopped
    mem_limit: 96m
    logging: *logging

volumes:
  redis_data:
