# Los logs llevan IPs (09-privacidad-seguridad, registros técnicos): se rotan
# para que no se acumulen sin límite, como promete /privacy.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    image: hackboard-api:local
    ports:
      - "3001:3001"
    env_file:
      - ./apps/api/.env.production
    restart: unless-stopped
    mem_limit: 400m
    logging: *logging
    environment:
      RAILS_MAX_THREADS: "3"

  worker:
    image: hackboard-api:local
    command: bundle exec sidekiq -C config/sidekiq.yml -c 3
    env_file:
      - ./apps/api/.env.production
    depends_on:
      - api
    restart: unless-stopped
    mem_limit: 350m
    logging: *logging
